name: ci

# Security posture of this workflow (see SECURITY_REVIEW.md):
# - Read-only token, no secrets, no OIDC, and nothing triggered by comments or by
#   pull_request_target.
# - Third-party actions are pinned to full commit SHAs, not mutable tags or branches.
#   The tag each SHA was resolved from is in the trailing comment. Re-resolve with
#   `git ls-remote --tags https://github.com/actions/<name>` when bumping.
# - Dependencies install from the lockfile with lifecycle scripts disabled.
# - Typecheck, build and tests run behind two independent layers:
#   1. a network namespace whose only interface is loopback, so the kernel refuses
#      every other connection — including from native binaries (TypeScript 7's tsc,
#      the bundler's native core) that no JavaScript hook can see;
#   2. scripts/net-guard.cjs preloaded into every Node process, which blocks and
#      records what was attempted, so a failure says what tried to connect.
#   Only `npm ci` runs outside them, because fetching the locked tarballs from
#   registry.npmjs.org is its job.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install from the lockfile, no lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck, build and test with no route off the machine
        env:
          NODE_OPTIONS: --require ./scripts/net-guard.cjs
          NET_GUARD_BLOCK: "1"
          NET_GUARD_LOG: ${{ runner.temp }}/net-guard.jsonl
        # Root creates the namespace and brings loopback up, then the build runs as the
        # normal runner user. Values are passed explicitly because sudo resets PATH.
        run: |
          sudo unshare --net -- env PATH="$PATH" sh -ec '
            ip link set lo up
            exec sudo -u "$1" env PATH="$PATH" HOME="$2" NODE_OPTIONS="$3" NET_GUARD_BLOCK=1 NET_GUARD_LOG="$4" \
              sh -ec "npm run typecheck && npm run build && npx --no-install vitest run"
          ' sh "$(id -un)" "$HOME" "$NODE_OPTIONS" "$NET_GUARD_LOG"

      - name: Show every connection the job attempted
        if: always()
        run: |
          log="${{ runner.temp }}/net-guard.jsonl"
          if [ ! -f "$log" ]; then
            echo "::error::net-guard log missing: the guard never ran, so this run proves nothing"
            exit 1
          fi
          node -e '
            const lines = require("fs").readFileSync(process.argv[1], "utf8").trim().split("\n").map(JSON.parse);
            const attempts = lines.filter((l) => l.kind !== "loaded" && !l.local);
            // test/net-guard.test.ts probes the reserved .invalid TLD to prove blocking works.
            const selfTest = attempts.filter((l) => String(l.host).endsWith(".invalid"));
            const remote = attempts.filter((l) => !String(l.host).endsWith(".invalid"));
            console.log(`${lines.filter((l) => l.kind === "loaded").length} Node processes/threads guarded; ${selfTest.length} guard self-test probes blocked; ${remote.length} other non-loopback attempts`);
            for (const r of remote) console.log(`  BLOCKED ${r.kind} ${r.host}:${r.port ?? "-"} ${r.url ?? ""}`);
            process.exitCode = remote.length > 0 || selfTest.length === 0 ? 1 : 0;
          ' "$log"
